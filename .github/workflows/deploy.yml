name: Regenerate

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

  schedule:
    # Refresh hourly, away from the busy start of the hour.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run-pnpm-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.8.1
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Stats
        run: pnpm stats
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Validate and build SVG assets
        run: pnpm types && pnpm lint && pnpm test && pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3.7.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
